<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}

        {% endblock title %}

    </title>

    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        .nav-container {
            height: 60px;
            background-color: aqua;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .left-section {
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .left-section ul {
            list-style: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .left-section ul li {
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .left-section ul li a {
            text-decoration: none;
            color: white;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-weight: bolder;
            font-size: 16px;
            height: 30px;
            text-align: center;
            padding-top: 12px;
            border-radius: 10px;
            padding-left: 5px;
            padding-right: 5px;

        }

        .left-section ul li a:hover {
            cursor: pointer;
            background-color: navajowhite;
        }

        .right-section {
            height: 60px;
            width: 700px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .right-section form {
            display: flex;
            gap: 30px;
        }

        .right-section form input {
            height: 30px;
            width: 450px;
            border-radius: 5px;
            padding-left: 10px;
            font-size: 20px;
        }

        .right-section form button {
            height: 35px;
            width: 100px;
            font-size: 17px;
        }

        .right-section form button:hover {
            cursor: pointer;
        }
    </style>
    {% block extra_css%}
    {% endblock extra_css%}


</head>

<body>
    <div class="main-container">
        <nav class="nav-container">
            <div class="left-section">
                <ul>

                    <li>
                        <a href="">Library Management System</a>
                    </li>

                    <li>
                        <a href="">About</a>
                    </li>

                    <li>
                        <a href="">Contact</a>
                    </li>

                </ul>
            </div>

            <div class="right-section">
                <form action="">
                    <input type="text" placeholder="Are u searching for books..?">
                    <button>Search</button>
                </form>
            </div>

        </nav>


        {% block content %}

        {% endblock content %}


    </div>
</body>

</html>
