<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        table{
            border: 1px solid black;
        }

        th,td{
            border: 1px solid black;
            text-align: center;
            padding: 10px;
        }
    </style>

</head>
<body>
    
    <div>
        <h1>Available Books</h1>
        <hr>
        <table>
            <thead>
                <th>Book Id</th>
                <th>Title</th>
                <th>Price</th>
                <th>Edition</th>
                <th>Author</th>
                <th>Language</th>
                <th>Description</th>
            </thead>

            <tbody>
                {% for book in books %}
                    <tr>
                        <td>{{book.id}}</td>
                        <td>{{book.title}}</td>
                        <td>{{book.price}}</td>
                        <td>{{book.edition}}</td>
                        <td>{{book.author}}</td>
                        <td>{{book.language}}</td>
                        <td>{{book.description}}</td>
                    </tr>
                {% endfor %}
            </tbody>

        </table>
    </div>

</body>
</html>
